<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Osteopatía GB</title>
<meta name="robots" content="noindex">
<!-- Autocontenida: una 404 se sirve desde cualquier ruta, no puede depender de assets relativos -->
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
    text-align: center;
    padding: 2rem;
    background: #FDF8F0;
    color: #1E1E1E;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }
  h1, p { max-width: 100%; } /* en flex column centrado, sin esto el texto no hace wrap y desborda en mobile */
  h1 { font-family: Georgia, 'Times New Roman', serif; color: #003233; font-size: 2rem; margin: 0; }
  p { color: #404848; margin: 0; }
  a.btn {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 1rem 2rem;
    background: #25D366;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    border-radius: 1.5rem;
  }
</style>
<script>
  // En github.io el sitio vive bajo /osteopatia-gb/; con dominio propio, en /
  var root = location.hostname.endsWith('github.io') ? '/osteopatia-gb/' : '/';
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('home-link').href = root;
  });
</script>
</head>
<body>
<h1>Página no encontrada</h1>
<p>La página que buscás no existe o fue movida.</p>
<a class="btn" id="home-link" href="/">Volver al inicio</a>
</body>
</html>
